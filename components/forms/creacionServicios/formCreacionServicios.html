<link rel="stylesheet" href="formCreacionServicios.css">

<div class="col form-container">

    <form id="formCreacionServicios" class="formulario" enctype="multipart/form-data">


        <!-- action="https://formspree.io/f/mkokrkew" -->
        <div class="input-group">
            <input type="text" id="nombre" required placeholder="">
            <label>Nombre </label>
            <span class="error" id="errorNombre"></span>
        </div>

        <div class="input-group">
            <input type="text" id="descripcion" name="descripcion" required placeholder="">
            <label>Descripcion</label>
            <span class="error" id="errorDescripcion"></span>
        </div>

        <div class="input-group ultimo_input_group">
            <input type="text" id="precio" name="precio" required placeholder="">
            <label>Precio</label>
            <span class="error" id="errorPrecio"></span>
        </div>

        <div class="input-group ultimo_input_group">
            <input type="number" id="duracionMinutos" name="duracionMinutos" required min="15" max="480" step="15" value="60" placeholder="">
            <label>Duración estimada (min)</label>
            <span class="error" id="errorDuracion"></span>
        </div>

        <div class="input-group ultimo_input_group">
            <select id="tipoServicio" required>
                <option value="" disabled selected>Seleccione tipo</option>
            </select>
            <label>Tipo de servicio</label>
            <span class="error" id="errorTipo"></span>
        </div>
        <div class="contenedor_subir_imagen">
            <label>Imagen del servicio</label>
            <div class="caja_subir">
                <select id="imagenPreset" class="form-select form-select-sm mb-2">
                    <option value="">Imagen por defecto (corte premium)</option>
                    <option value="corte-premium.png">Corte premium</option>
                    <option value="tinte-coloracion.png">Tinte y coloración</option>
                    <option value="keratina.png">Keratina</option>
                    <option value="barba-afeitado.png">Barba y afeitado</option>
                    <option value="peinado-eventos.png">Peinado eventos</option>
                    <option value="mechas-reflejos.png">Mechas y reflejos</option>
                    <option value="tratamiento-capilar.png">Tratamiento capilar</option>
                    <option value="cepillado-brasileno.png">Cepillado brasileño</option>
                    <option value="maquillaje-profesional.png">Maquillaje profesional</option>
                    <option value="limpieza-facial.png">Limpieza facial</option>
                </select>
                <input type="url" id="imagenURL" class="form-control form-control-sm mb-2" placeholder="URL pública (GitHub Pages o /assets/images/...)">
                <p class="small text-muted mb-2">Las imágenes se sirven desde el repositorio; no se usa Cloudinary.</p>
                <img id="preview" src="" alt="Vista previa" style="display:none;max-width:100%;border-radius:8px;">
            </div>
        </div>
        <div class="status">
            <span>Status:</span>
            <input type="radio" id="activo" name="status" value="true" checked>
            <label for="activo">Activo</label>
            <input type="radio" id="inactivo" name="status" value="false">
            <label for="inactivo">Inactivo</label>
        </div>
        <input type="hidden" id="editId" value="">
        <input type="hidden" id="imagenActual" value="">
        <button type="submit" class="btn-enviar">Crear Servicio</button>

    </form>
</div>
