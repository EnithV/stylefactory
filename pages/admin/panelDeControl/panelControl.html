<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Hojas de estilo locales con rutas relativas a la ubicación (pages/admin/panelDeControl/) -->
  <link rel="stylesheet" href="../../../pages/admin/listaReservas/listaReservas.css">
  <link rel="stylesheet" href="../../../components/metricas/metricas.css">
  <link rel="stylesheet" href="../../../components/navbarAdmin/navbar_Admin.css">
  <link rel="stylesheet" href="panelControl.css">

  <title>Panel de control</title>
</head>

<body>

  <div id="navbarAdmin-placeholder">
    <div class="d-flex">

      <aside id="sidebar" class="sidebar d-flex flex-column collapsed">

        <div>
          <div class="sidebar-header">
            <h4 class="logo-text">Admin</h4>
            <button id="toggleBtn" class="btn-toggle" type="button">
              <i class="fas fa-bars"></i>
            </button>
          </div>

          <ul class="nav flex-column mt-4">

            <li>
              <a class="nav-link active" href="#" data-page="../../../components/metricas/metricas.html">
                <i class="fas fa-home"></i>
                <span class="link-text">Inicio</span>
              </a>
            </li>

            <li>
              <a class="nav-link" href="#" data-page="../../../pages/admin/listaServicios/listaServicios.html">
                <i class="fas fa-scissors"></i>
                <span class="link-text">Servicios</span>
              </a>
            </li>

            <li>
              <a class="nav-link" href="#" data-page="../../../pages/admin/listaReservas/listaReservas.html">
                <i class="fas fa-calendar-check"></i>
                <span class="link-text">Reservas</span>
              </a>
            </li>

          </ul>
        </div>

        <div class="mt-auto mb-3">
          <a class="nav-link logout" href="#">
            <i class="fas fa-right-from-bracket"></i>
            <span class="link-text">Salir</span>
          </a>
        </div>

      </aside>

      <main id="content" class="content px-2 md-p-4 w-100"></main>

    </div>
  </div>

  <!-- Modal de confirmación de salida -->
  <div class="modal fade" id="modalSalir" tabindex="-1" aria-labelledby="modalSalirLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalSalirLabel">Confirmar salida</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Quieres salir del panel administrador?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnSalirConfirmado">Salir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts de terceros -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Scripts locales: config y métricas antes del panel -->
  <script src="../../../assets/js/config.js"></script>
  <script src="../../../components/metricas/metricas.js"></script>
  <script src="panelControl.js"></script>

</body>
</html>
