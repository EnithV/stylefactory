<div class="admin-lista-reservas-panel admin-seccion-embebida">
  <section class="seccion-lista-reservas">
    <div class="cabecera-lista-reservas">
      <h2>LISTA DE SERVICIOS</h2>
      <div class="linea-cabecera"></div>
      <button
        type="button"
        class="btn btn-agregar-servicio"
        data-bs-toggle="modal"
        data-bs-target="#exampleModal"
        title="Agregar"
      >
        <i class="fa-solid fa-plus" style="color: white"></i>
      </button>
    </div>

    <div class="contenedor-tabla-reservas">
      <table
        class="table table-striped tabla-lista-reservas"
        style="table-layout: fixed; width: 100%"
      >
        <thead>
          <tr>
            <th>ID</th>
            <th>SERVICIO</th>
            <th>DESCRIPCIÓN</th>
            <th>DURACIÓN</th>
            <th>ESTADO</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="tabla-servicios"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5 text-center card-title">Creación de servicio</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="form-services"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">¿Estás segura de que deseas eliminar este servicio?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" id="btn-confirmar-eliminar">Eliminar</button>
      </div>
    </div>
  </div>
</div>
